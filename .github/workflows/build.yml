name: Build QAN Geometry, Studio, West Japan + Tokyo GIFs and Windows releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qan-geometry-latest-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    env:
      DEMO_VERSION: 0.6.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build pyinstaller
      - run: python -m pip install .
      - name: Build Geometry Editor desktop executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name QAN-Geometry-Editor --collect-all qan_geometry src/qan_geometry_editor/app.py
      - name: Build WebGL Studio desktop launcher
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name QAN-Geometry-Studio --add-data "viewer;viewer" src/qan_geometry_editor/studio_launcher.py
      - name: Write version information
        shell: pwsh
        run: |
          "QAN Geometry Editor + Studio v$env:DEMO_VERSION" | Out-File -FilePath dist/VERSION.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: QAN-Tokyo-Windows-x64
          path: |
            dist/QAN-Geometry-Editor.exe
            dist/QAN-Geometry-Studio.exe
            dist/VERSION.txt

  tokyo-gif:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - name: Generate Tokyo orbit GIF
        run: |
          mkdir -p dist
          OUTPUT_GIF=dist/QAN-Tokyo-EVA-City.gif python scripts/generate_tokyo_eva_gif.py
      - uses: actions/upload-artifact@v4
        with:
          name: QAN-Tokyo-EVA-City-GIF
          path: dist/QAN-Tokyo-EVA-City.gif

  west-japan-gif:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - name: Generate West Japan orbit GIF
        run: |
          mkdir -p dist
          OUTPUT_GIF=dist/QAN-West-Japan-Neo-World.gif python scripts/generate_west_japan_gif.py
      - uses: actions/upload-artifact@v4
        with:
          name: QAN-West-Japan-GIF
          path: dist/QAN-West-Japan-Neo-World.gif

  python-library:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: qan-geometry-python-library
          path: dist/*

  publish-release:
    needs: [windows-exe, tokyo-gif, west-japan-gif]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: QAN-*
          path: release-assets
          merge-multiple: true
      - name: Publish Windows apps, Tokyo GIF and West Japan GIF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: QAN Geometry + Tokyo EVA City — Latest Windows Preview
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            release-assets/QAN-Geometry-Editor.exe
            release-assets/QAN-Geometry-Studio.exe
            release-assets/QAN-Tokyo-EVA-City.gif
            release-assets/VERSION.txt
          body: |
            QAN PI Tokyo EVA City concept release.
            Includes the lightweight quad-mesh desktop editor, the WebGL Studio launcher,
            and an orbit GIF preview. Studio and city viewer require internet access for
            Three.js / TopoJSON CDN data. The Tokyo city scene is stylized: 23-ward
            boundaries are sourced from OpenStreetMap-derived data; buildings, Tama
            relief, island inset and proposed viaducts are observation/concept geometry.
            Attribution: © OpenStreetMap contributors. See docs/tokyo-eva-city.md.\n            Also includes the fictional Kyushu-Shikoku-Chugoku QAN PI orbit GIF. See docs/west-japan-neo-world.md.
